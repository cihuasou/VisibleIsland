name: Build VisibleIsland

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install ldid xz
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Install roothide Theos
        run: |
          export THEOS="$GITHUB_WORKSPACE/theos"

          git clone --recursive \
            https://github.com/roothide/theos.git \
            "$THEOS"

          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Install iOS 16.5 SDK
        run: |
          export THEOS="$GITHUB_WORKSPACE/theos"

          git clone --depth 1 \
            https://github.com/theos/sdks.git \
            /tmp/theos-sdks

          mkdir -p "$THEOS/sdks"

          cp -R \
            /tmp/theos-sdks/iPhoneOS16.5.sdk \
            "$THEOS/sdks/"

      - name: Verify environment
        run: |
          set -e

          echo "======================================"
          echo "THEOS"
          echo "======================================"
          echo "$THEOS"

          echo
          echo "======================================"
          echo "ldid"
          echo "======================================"
          which ldid
          ldid --version || true

          echo
          echo "======================================"
          echo "SDK"
          echo "======================================"
          ls -ld "$THEOS/sdks/iPhoneOS16.5.sdk"

          echo
          echo "======================================"
          echo "Theos"
          echo "======================================"
          ls -ld "$THEOS"
          test -f "$THEOS/makefiles/common.mk"

      - name: Clean previous packages
        run: |
          rm -rf packages
          mkdir -p packages

          make clean || true

      - name: Build
        run: |
          set -e

          make clean
          make package FINALPACKAGE=1

      - name: Show generated packages
        run: |
          set -e

          echo "======================================"
          echo "Generated packages"
          echo "======================================"

          find packages \
            -maxdepth 1 \
            -type f \
            -name "*.deb" \
            -print

      - name: Prepare arm64e artifact
        run: |
          set -e

          rm -rf artifact
          mkdir -p artifact

          PKG=$(find packages \
            -maxdepth 1 \
            -type f \
            -name "*_iphoneos-arm64e.deb" \
            | head -n 1)

          if [ -z "$PKG" ]; then
            echo "ERROR: arm64e package was not generated."
            exit 1
          fi

          cp "$PKG" artifact/

          echo "Artifact:"
          ls -lh artifact/

      - name: Upload arm64e package
        uses: actions/upload-artifact@v4
        with:
          name: VisibleIsland-arm64e
          path: artifact/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Upload all packages
        uses: actions/upload-artifact@v4
        with:
          name: VisibleIsland-all
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 7
