name: Build VisibleIsland

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Install build dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          set -e

          brew install ldid dpkg

          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      # --------------------------------------------------
      # Clone Theos
      # --------------------------------------------------
      - name: Install Theos
        run: |
          set -e

          rm -rf "$THEOS"

          git clone --recursive \
            https://github.com/theos/theos.git \
            "$THEOS"

          chmod +x "$THEOS/bin/"*

      # --------------------------------------------------
      # Install Theos dependencies
      # --------------------------------------------------
      - name: Install Theos dependencies
        run: |
          set -e

          "$THEOS/bin/bootstrap"

      # --------------------------------------------------
      # Install iOS SDK
      # --------------------------------------------------
      - name: Install iOS 16.5 SDK
        run: |
          set -e

          SDK="$THEOS/sdks/iPhoneOS16.5.sdk"

          if [ -d "$SDK" ]; then
            echo "iPhoneOS16.5.sdk already exists"
            exit 0
          fi

          rm -rf "$RUNNER_TEMP/theos-sdks"

          git clone \
            --depth 1 \
            https://github.com/theos/sdks.git \
            "$RUNNER_TEMP/theos-sdks"

          if [ ! -d "$RUNNER_TEMP/theos-sdks/iPhoneOS16.5.sdk" ]; then
            echo "ERROR: iPhoneOS16.5.sdk not found"
            exit 1
          fi

          cp -R \
            "$RUNNER_TEMP/theos-sdks/iPhoneOS16.5.sdk" \
            "$SDK"

      # --------------------------------------------------
      # Install roothide support
      # --------------------------------------------------
      - name: Install roothide support
        run: |
          set -e

          if grep -R "roothide" "$THEOS/makefiles" >/dev/null 2>&1; then
            echo "Theos already contains roothide support"
          else
            echo "Installing roothide support..."

            rm -rf "$RUNNER_TEMP/roothide-developer"

            git clone \
              --depth 1 \
              https://github.com/roothide/Developer.git \
              "$RUNNER_TEMP/roothide-developer"

            find "$RUNNER_TEMP/roothide-developer" \
              -maxdepth 2 \
              -type f \
              -name '*.mk' \
              -print
          fi

      # --------------------------------------------------
      # Verify environment
      # --------------------------------------------------
      - name: Verify environment
        run: |
          set -e

          echo "===== Xcode ====="
          xcodebuild -version

          echo "===== Theos ====="
          echo "$THEOS"

          echo "===== SDK ====="
          ls -ld "$THEOS/sdks/iPhoneOS16.5.sdk"

          echo "===== ldid ====="
          which ldid
          ldid --version || true

          echo "===== dpkg ====="
          which dpkg
          dpkg --version | head -n 1

          echo "===== Make ====="
          make --version | head -n 1

      # --------------------------------------------------
      # Remove old packages
      # --------------------------------------------------
      - name: Clean old build output
        run: |
          set -e

          rm -rf packages
          rm -rf artifact

          mkdir -p packages
          mkdir -p artifact

          make clean || true

      # --------------------------------------------------
      # Build
      # --------------------------------------------------
      - name: Build Debian package
        run: |
          set -e

          make clean

          make package FINALPACKAGE=1

      # --------------------------------------------------
      # Show packages generated by THIS build
      # --------------------------------------------------
      - name: List generated packages
        run: |
          set -e

          echo "======================================"
          echo "Packages generated by current build:"
          echo "======================================"

          find packages \
            -maxdepth 1 \
            -type f \
            -name '*.deb' \
            -print

          COUNT=$(find packages \
            -maxdepth 1 \
            -type f \
            -name '*.deb' \
            | wc -l | tr -d ' ')

          echo "Package count: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No Debian package generated"
            exit 1
          fi

      # --------------------------------------------------
      # Select arm64e package
      # --------------------------------------------------
      - name: Select arm64e package
        run: |
          set -e

          PKG=$(find packages \
            -maxdepth 1 \
            -type f \
            -name '*_iphoneos-arm64e.deb' \
            | head -n 1)

          if [ -z "$PKG" ]; then
            echo "ERROR: arm64e package not found"
            exit 1
          fi

          echo "Selected:"
          echo "$PKG"

          cp "$PKG" artifact/

      # --------------------------------------------------
      # Verify Debian package
      # --------------------------------------------------
      - name: Verify arm64e package
        run: |
          set -e

          PKG=$(find artifact \
            -type f \
            -name '*.deb' \
            | head -n 1)

          echo "===== Package information ====="
          dpkg-deb -I "$PKG"

          echo
          echo "===== Package contents ====="
          dpkg-deb -c "$PKG"

          echo
          echo "===== Final artifact ====="
          ls -lh "$PKG"

      # --------------------------------------------------
      # Upload arm64e package
      # --------------------------------------------------
      - name: Upload arm64e package
        uses: actions/upload-artifact@v4
        with:
          name: VisibleIsland-arm64e
          path: artifact/*.deb
          if-no-files-found: error
          retention-days: 30
