name: Build VisibleIsland

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-dir: ${{ github.workspace }}/theos
          theos-src: https://github.com/theos/theos
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Show SDKs
        run: |
          echo "THEOS=$THEOS"
          echo "SDKs:"
          ls -la "$THEOS/sdks"

      - name: Check Preferences
        run: |
          echo "Searching for Preferences..."
          find "$THEOS/sdks" \
            \( -name "Preferences.tbd" -o -name "Preferences.framework" \) \
            -print || true

      - name: Build
        run: |
          export THEOS="${{ github.workspace }}/theos"

          make clean
          make package FINALPACKAGE=1

      - name: List packages
        run: |
          find . -type f \
            \( -name "*.deb" -o -name "*.ipa" \) \
            -print

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: VisibleIsland-package
          path: packages/*.deb
          if-no-files-found: error
