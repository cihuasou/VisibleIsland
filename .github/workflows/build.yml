name: Build VisibleIsland

on:
  workflow_dispatch:

jobs:
  build:
    name: Build VisibleIsland
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          echo "===== XCODE ====="
          xcode-select -p
          xcodebuild -version

      - name: Install roothide Theos
        run: |
          export THEOS="$HOME/theos"

          bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)"

          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Install Theos SDKs
        run: |
          echo "===== INSTALL SDK ====="

          git clone --depth 1 \
            https://github.com/theos/sdks.git \
            "$RUNNER_TEMP/theos-sdks"

          mkdir -p "$THEOS/sdks"

          find "$RUNNER_TEMP/theos-sdks" \
            -maxdepth 1 \
            -type d \
            -name "*.sdk" \
            -exec cp -R {} "$THEOS/sdks/" \;

          echo "===== SDK LIST ====="
          ls -lah "$THEOS/sdks"

      - name: Check Preferences framework
        run: |
          echo "===== SEARCH PREFERENCES ====="

          find "$THEOS" \
            -iname "Preferences.framework" \
            -o -iname "Preferences.tbd" \
            | head -50

      - name: Clean
        run: |
          make clean || true
          rm -rf packages
          mkdir -p packages

      - name: Build
        run: |
          echo "===== BUILD START ====="

          make clean package FINALPACKAGE=1 messages=yes

          echo "===== BUILD FINISHED ====="

      - name: Check package
        run: |
          echo "===== PACKAGES ====="
          ls -lah packages/

          test -n "$(find packages -name '*.deb' -print -quit)"

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: VisibleIsland-deb
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 30
