name: Build VisibleIsland

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install ldid xz
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Install roothide Theos
        run: |
          export THEOS="$GITHUB_WORKSPACE/theos"

          git clone --recursive \
            https://github.com/roothide/theos.git \
            "$THEOS"

          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Install iOS 16.5 SDK
        run: |
          export THEOS="$GITHUB_WORKSPACE/theos"

          git clone --depth 1 \
            https://github.com/theos/sdks.git \
            /tmp/theos-sdks

          mkdir -p "$THEOS/sdks"

          cp -R \
            /tmp/theos-sdks/iPhoneOS16.5.sdk \
            "$THEOS/sdks/"

      - name: Verify environment
        run: |
          echo "THEOS=$THEOS"
          echo
          echo "ldid:"
          which ldid
          echo
          echo "SDK:"
          ls -ld "$THEOS/sdks/iPhoneOS16.5.sdk"

      - name: Build
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: Show generated packages
        run: |
          find packages \
            -maxdepth 1 \
            -type f \
            -name "*.deb" \
            -print

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: VisibleIsland-deb
          path: packages/*.deb
          if-no-files-found: error
